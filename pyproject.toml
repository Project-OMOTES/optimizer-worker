[project]
name = "omotes-optimizer-worker"
version = "0.0.1"
authors = [
    { name = "Mark Vrijlandt", email = "mark.vrijlandt@tno.nl" },
    { name = "Cheng-Kai Wang", email = "cheng-kai.wang@tno.nl" },
    { name = "Sebastiaan la Fleur", email = "sebastiaan.lafleur@tno.nl" }
]
description = "Nieuwe Warmte Nu - Optimizer Worker"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
readme = "README.md"
license = { file = "LICENSE" }

requires-python = "==3.11.*"
dependencies = [
    "python-dotenv ~= 1.0.0",
    "mesido ~= 0.1.21",
    "omotes-sdk-python ~= 5.0.4",
    "pyesdl ~= 26.7.1",
]

[dependency-groups]
dev = [
    "setuptools ~= 75.6.0",
    "wheel ~= 0.45.1",
    "pip-tools ~= 7.4.0",
    "ruff ~= 0.15.22",
    "ty ~= 0.0.61",
    "pytest ~= 8.3.4",
    "pytest-cov ~= 6.0.0",
    "build ~= 1.2.2",
]

[project.urls]
homepage = "https://www.nwn.nu"
documentation = "https://readthedocs.org"
repository = "https://github.com/Nieuwe-Warmte-Nu/optimizer-worker"
changelog = "https://github.com/Nieuwe-Warmte-Nu/optimizer-worker/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "omotes_optimizer_worker"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src --cov-report html --cov-report term-missing --cov-fail-under 50"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "DOC", # flake8-docstrings
    "S",   # flake8-bandit
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]
exclude = ["justfile", ".editorconfig"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/env.py" = [
    "DOC201", # Simple getter methods in EnvSettings use concise one-line docstrings.
]
"tests/**" = ["S101"]  # assert statements are standard in tests
