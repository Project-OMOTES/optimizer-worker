name: Deploy Optimizer to NWN ME
run-name: Deploy Optimizer ${{ github.event.workflow_run.head_branch }} to NWN ME

on:
  workflow_run:
    workflows:
      - Publish Container Image
    types:
      - completed

env:
  IMAGE_NAME: ghcr.io/project-omotes/omotes-optimizer

jobs:
  deploy-test:
    name: Deploy to NWN ME TEST
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    environment: nwn-me-test
    permissions:
      actions: read
      packages: read
    outputs:
      image-tag: ${{ steps.read-tag.outputs.image-tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download deployment metadata
        uses: actions/download-artifact@v4
        with:
          name: deployment-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published image tag
        id: read-tag
        run: |
          tag="$(cat image_tag.txt)"

          if [[ -z "${tag}" ]]; then
            echo "Downloaded image tag artifact is empty."
            exit 1
          fi

          echo "IMAGE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "image-tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Pull container image
        run: docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Register Prefect deployment in test
        run: |
          docker run --rm \
            -e LOG_LEVEL=INFO \
            -e PREFECT_API_URL \
            -e PREFECT_API_AUTH_STRING \
            -e PREFECT_API_URL_FOR_WORKER=http://omotes-prefect-server:4200/api \
            -e PREFECT_WORK_POOL_NAME=docker-worker \
            -e OPTIMIZER_WORKER_VERSION="${IMAGE_TAG}" \
            -e ESDL_OUTPUT_PROFILES_TYPE=POSTGRESQL \
            -e PREFECT_FLOW_MAX_CONCURRENT_RUNS=4 \
            -e PREFECT_FLOW_TIMEOUT_SECONDS=172800 \
            -e DB_HOSTNAME=omotes_postgres \
            -e DB_PORT=6432 \
            -e DB_USERNAME=omotes_timeseries_rw \
            -e DB_PASSWORD \
            -e PG_DB_TIMESERIES=omotes_timeseries \
            -e MINIO_HOST=omotes-minio \
            -e MINIO_PORT=9000 \
            -e MINIO_EXTERNAL_URL \
            -e MINIO_ACCESS_KEY=omotesadmin \
            -e MINIO_SECRET \
            -e PREFECT_DOCKER_WORKER_NETWORK=omotes \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /src/.venv/bin/python -m omotes_optimizer_worker.prefect_deploy_flow
        env:
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MINIO_EXTERNAL_URL: ${{ vars.MINIO_EXTERNAL_URL }}
          MINIO_SECRET: ${{ secrets.MINIO_SECRET }}

  deploy-production:
    name: Deploy to NWN ME PROD
    runs-on: ubuntu-latest
    needs: deploy-test
    environment: nwn-me-production
    permissions:
      packages: read
    env:
      IMAGE_TAG: ${{ needs.deploy-test.outputs.image-tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published container image
        run: docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Register Prefect deployment in production
        run: |
          docker run --rm \
            -e LOG_LEVEL=INFO \
            -e PREFECT_API_URL \
            -e PREFECT_API_AUTH_STRING \
            -e PREFECT_API_URL_FOR_WORKER=http://omotes-prefect-server:4200/api \
            -e PREFECT_WORK_POOL_NAME=docker-worker \
            -e OPTIMIZER_WORKER_VERSION="${IMAGE_TAG}" \
            -e ESDL_OUTPUT_PROFILES_TYPE=POSTGRESQL \
            -e PREFECT_FLOW_MAX_CONCURRENT_RUNS=4 \
            -e PREFECT_FLOW_TIMEOUT_SECONDS=172800 \
            -e DB_HOSTNAME=omotes_postgres \
            -e DB_PORT=6432 \
            -e DB_USERNAME=omotes_timeseries_rw \
            -e DB_PASSWORD \
            -e MINIO_HOST=omotes-minio \
            -e MINIO_PORT=9000 \
            -e MINIO_EXTERNAL_URL \
            -e MINIO_ACCESS_KEY=omotesadmin \
            -e MINIO_SECRET \
            -e PREFECT_DOCKER_WORKER_NETWORK=omotes \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /src/.venv/bin/python -m omotes_optimizer_worker.prefect_deploy_flow
        env:
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MINIO_EXTERNAL_URL: ${{ vars.MINIO_EXTERNAL_URL }}
          MINIO_SECRET: ${{ secrets.MINIO_SECRET }}
