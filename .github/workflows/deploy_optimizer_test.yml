name: Deploy Optimizer to NWN ME

on:
  push:
    tags:
      - "*"

env:
  IMAGE_NAME: ghcr.io/project-omotes/omotes-optimizer
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  deploy-test:
    name: Deploy to NWN ME TEST
    runs-on: ubuntu-latest
    environment: nwn-me-test
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for published container image
        run: |
          image="${IMAGE_NAME}:${IMAGE_TAG}"

          for attempt in {1..30}; do
            if docker pull "${image}"; then
              revision="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
              if [[ "${revision}" == "${GITHUB_SHA}" ]]; then
                exit 0
              fi

              echo "Pulled ${image}, but revision ${revision} does not match ${GITHUB_SHA}. Waiting for the tag image to be updated."
            else
              echo "Image ${image} is not available yet."
            fi

            sleep 20
          done

          echo "Image ${image} for revision ${GITHUB_SHA} was not available in time."
          exit 1

      - name: Register Prefect deployment in test
        run: |
          docker run --rm \
            -e LOG_LEVEL=INFO \
            -e PREFECT_API_URL=http://omotes-prefect-server:4200/api \
            -e PREFECT_API_AUTH_STRING \
            -e PREFECT_API_URL_FOR_WORKER=http://omotes-prefect-server:4200/api \
            -e PREFECT_WORK_POOL_NAME=docker-worker \
            -e OPTIMIZER_WORKER_VERSION="${IMAGE_TAG}" \
            -e ESDL_OUTPUT_PROFILES_TYPE=POSTGRESQL \
            -e PREFECT_FLOW_MAX_CONCURRENT_RUNS=4 \
            -e PREFECT_FLOW_TIMEOUT_SECONDS=172800 \
            -e DB_HOSTNAME=omotes_postgres \
            -e DB_PORT=6432 \
            -e DB_USERNAME=omotes_timeseries_rw \
            -e DB_PASSWORD \
            -e MINIO_HOST=omotes-minio \
            -e MINIO_PORT=9000 \
            -e MINIO_EXTERNAL_URL \
            -e MINIO_ACCESS_KEY=omotesadmin \
            -e MINIO_SECRET \
            -e PREFECT_DOCKER_WORKER_NETWORK=omotes \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /src/.venv/bin/python -m omotes_optimizer_worker.prefect_deploy_flow
        env:
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MINIO_EXTERNAL_URL: https://minio-api.test.nwn-design-toolkit.nl/
          MINIO_SECRET: ${{ secrets.MINIO_SECRET }}

  deploy-production:
    name: Deploy to NWN ME PROD
    runs-on: ubuntu-latest
    needs: deploy-test
    environment: nwn-me-production
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published container image
        run: docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Register Prefect deployment in production
        run: |
          docker run --rm \
            -e LOG_LEVEL=INFO \
            -e PREFECT_API_URL=http://omotes-prefect-server:4200/api \
            -e PREFECT_API_AUTH_STRING \
            -e PREFECT_API_URL_FOR_WORKER=http://omotes-prefect-server:4200/api \
            -e PREFECT_WORK_POOL_NAME=docker-worker \
            -e OPTIMIZER_WORKER_VERSION="${IMAGE_TAG}" \
            -e ESDL_OUTPUT_PROFILES_TYPE=POSTGRESQL \
            -e PREFECT_FLOW_MAX_CONCURRENT_RUNS=4 \
            -e PREFECT_FLOW_TIMEOUT_SECONDS=172800 \
            -e DB_HOSTNAME=omotes_postgres \
            -e DB_PORT=6432 \
            -e DB_USERNAME=omotes_timeseries_rw \
            -e DB_PASSWORD \
            -e MINIO_HOST=omotes-minio \
            -e MINIO_PORT=9000 \
            -e MINIO_EXTERNAL_URL \
            -e MINIO_ACCESS_KEY=omotesadmin \
            -e MINIO_SECRET \
            -e PREFECT_DOCKER_WORKER_NETWORK=omotes \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /src/.venv/bin/python -m omotes_optimizer_worker.prefect_deploy_flow
        env:
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MINIO_EXTERNAL_URL: https://minio-api.nwn-design-toolkit.nl/
          MINIO_SECRET: ${{ secrets.MINIO_SECRET }}
